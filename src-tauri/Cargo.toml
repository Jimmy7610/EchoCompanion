[package]
name = "echo-companion"
version = "0.1.0"
description = "EchoCompanion — Din lokala AI-kompis för idéer, kod och projekt."
authors = ["Jimmy Eliasson"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "echo_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
